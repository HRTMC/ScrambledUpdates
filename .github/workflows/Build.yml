name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commonlib_tag:
        description: 'alandtse/CommonLibSSE-NG release tag to use'
        required: true
        default: 'v4.29.0'

env:
  COMMONLIB_TAG: ${{ github.event.inputs.commonlib_tag || 'v4.29.0' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- vcpkg -----------------------------------------------------------
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '' # leave blank for latest; pin a commit for reproducible builds

      # --- CommonLibSSE-NG prebuilt CMake bundle ----------------------------
      # Use gh (preinstalled on Actions runners) to fetch the *actual* release
      # asset by pattern instead of guessing the exact filename/URL - avoids
      # 404s or downloading the wrong asset silently.
      - name: Download CommonLibSSE-NG prebuilt bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ env.COMMONLIB_TAG }}"

          New-Item -ItemType Directory -Force -Path dl | Out-Null

          Write-Host "Assets available for tag ${tag}:"
          gh release view $tag --repo alandtse/CommonLibSSE-NG --json assets --jq '.assets[].name'

          gh release download $tag `
            --repo alandtse/CommonLibSSE-NG `
            --pattern "*all-msvc-cmake.zip*" `
            --dir dl `
            --clobber

          $zip = Get-ChildItem dl -Filter "*all-msvc-cmake.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "No *all-msvc-cmake.zip asset found for tag $tag"
            exit 1
          }

          $sha = Get-ChildItem dl -Filter "$($zip.Name).sha256" | Select-Object -First 1
          if ($sha) {
            $expected = (Get-Content $sha.FullName).Split(" ")[0].Trim().ToLower()
            $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            if ($expected -ne $actual) {
              Write-Error "SHA256 mismatch for $($zip.Name) (expected $expected, got $actual)"
              exit 1
            }
          } else {
            Write-Host "No .sha256 sidecar found for this asset - skipping verification"
          }

          # Extract into a staging folder (not the final destination) so we
          # can locate the real bundle root and copy it into place cleanly,
          # regardless of whether the archive wraps things in a subfolder.
          $staging = "dl/extracted"
          Expand-Archive -Path $zip.FullName -DestinationPath $staging -Force

          $foundLib = Get-ChildItem $staging -Recurse -Filter CommonLibSSE.lib | Select-Object -First 1
          if (-not $foundLib) {
            Write-Host "Full staging tree:"
            Get-ChildItem $staging -Recurse | Select-Object FullName
            Write-Error "CommonLibSSE.lib not found anywhere in the extracted archive"
            exit 1
          }
          $bundleRoot = $foundLib.Directory.Parent.FullName

          Write-Host "Bundle root resolved to: $bundleRoot"
          Write-Host "Bundle root contents:"
          Get-ChildItem $bundleRoot | Select-Object Name

          if (Test-Path extern/commonlibsse-ng) {
            Remove-Item extern/commonlibsse-ng -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path extern/commonlibsse-ng | Out-Null
          Copy-Item -Path "$bundleRoot\*" -Destination extern/commonlibsse-ng -Recurse -Force

          # Verify TOOLSET_VERSION.txt landed where CMakeLists.txt expects it.
          # Dump full contents on failure so we can see exactly what shipped
          # in this asset instead of guessing again.
          $toolsetFile = "extern/commonlibsse-ng/TOOLSET_VERSION.txt"
          if (Test-Path $toolsetFile) {
            Write-Host "TOOLSET_VERSION.txt found, contents:"
            Get-Content $toolsetFile
          } else {
            Write-Host "TOOLSET_VERSION.txt NOT found at $toolsetFile"
            Write-Host "Full copied tree under extern/commonlibsse-ng:"
            Get-ChildItem extern/commonlibsse-ng -Recurse | Select-Object FullName
            Write-Error "TOOLSET_VERSION.txt missing from bundle for tag ${tag} - see tree above"
            exit 1
          }

      # If the runner's MSVC toolset (windows-latest -> VS2022) doesn't match
      # the bundle's baked TOOLSET_VERSION.txt major.minor, ScrambledUpdates'
      # CMakeLists.txt fails fast with a clear FATAL_ERROR - bump
      # COMMONLIB_TAG to a release built against a closer toolset if that happens.

      - name: Configure
        shell: pwsh
        run: cmake --preset release

      - name: Build
        shell: pwsh
        run: cmake --build --preset release

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/release/Release/ScrambledUpdates.dll dist/
          Copy-Item build/release/Release/ScrambledUpdates.pdb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrambledUpdates
          path: dist/
