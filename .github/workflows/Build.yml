name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commonlib_tag:
        description: 'alandtse/CommonLibSSE-NG release tag to use'
        required: true
        default: 'v4.29.0'

env:
  COMMONLIB_TAG: ${{ github.event.inputs.commonlib_tag || 'v4.29.0' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- vcpkg -----------------------------------------------------------
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '' # leave blank for latest; pin a commit for reproducible builds

      # --- CommonLibSSE-NG prebuilt CMake bundle ----------------------------
      # alandtse/CommonLibSSE-NG publishes commonlibsse-ng-prebuilt-<tag>-all-msvc-cmake.zip
      # on every release, containing lib/CommonLibSSE.lib, lib/openvr_api.lib,
      # include/, extern/openvr/headers/, and TOOLSET_VERSION.txt - exactly what
      # ScrambledUpdates' CMakeLists.txt checks for in extern/commonlibsse-ng.
      - name: Download and verify CommonLibSSE-NG prebuilt bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ env.COMMONLIB_TAG }}"
          $base = "https://github.com/alandtse/CommonLibSSE-NG/releases/download/$tag"
          $zipName = "commonlibsse-ng-prebuilt-$tag-all-msvc-cmake.zip"

          Invoke-WebRequest -Uri "$base/$zipName" -OutFile $zipName
          Invoke-WebRequest -Uri "$base/$zipName.sha256" -OutFile "$zipName.sha256"

          $expected = (Get-Content "$zipName.sha256").Split(" ")[0].Trim().ToLower()
          $actual = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Error "SHA256 mismatch for $zipName (expected $expected, got $actual)"
            exit 1
          }

          Expand-Archive -Path $zipName -DestinationPath extern/commonlibsse-ng -Force

      # If the runner's MSVC toolset (windows-latest -> VS2022) doesn't match
      # the bundle's baked TOOLSET_VERSION.txt major.minor, ScrambledUpdates'
      # CMakeLists.txt fails fast with a clear FATAL_ERROR - bump
      # COMMONLIB_TAG to a release built against a closer toolset if that happens.

      - name: Configure
        shell: pwsh
        run: cmake --preset release

      - name: Build
        shell: pwsh
        run: cmake --build --preset release

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/release/Release/ScrambledUpdates.dll dist/
          Copy-Item build/release/Release/ScrambledUpdates.pdb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrambledUpdates
          path: dist/
